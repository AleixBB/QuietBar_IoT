CONFIG_STDOUT_CONSOLE=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_MPU6050=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="QuietBar Accel"

# Soporte de punto flotante en printk
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_ADC=y

# Suport C++ i memòria per a Edge Impulse
CONFIG_CPP=y
CONFIG_STD_CPP11=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_FPU=y
CONFIG_MAIN_STACK_SIZE=4096